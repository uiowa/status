name: Build status page

# Rebuild index.html whenever the content or shell changes, and commit it back.
# Loop guard: index.html is under paths-ignore, so the commit this job makes
# does not retrigger the workflow.
on:
  push:
    branches: [main]
    paths:
      - 'status.md'
      - 'template.html'
      - 'build.mjs'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-status-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci when a lockfile exists; otherwise a plain install. If this step
      # fails, the job stops here and the committed index.html is untouched.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: node build.mjs

      - name: Commit regenerated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html unchanged; nothing to commit."
          else
            git add index.html
            git commit -m "Build: regenerate index.html from status.md [skip ci]"
            git push
          fi
